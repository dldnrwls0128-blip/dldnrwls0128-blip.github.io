<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1f1d" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="하자싹 — 현장 시공불량·하자를 사진으로 기록하고 업체에 카톡·문자로 바로 전달하는 오프라인 하자관리 앱" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="하자싹" />
  <title>하자싹</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button type="button" id="btn-back" hidden aria-label="뒤로">‹</button>
      <h1 id="header-title">하자싹</h1>
      <span class="hdr-spacer"></span>
      <button type="button" id="sync-chip" class="sync-chip" data-k="login" hidden><span class="sc-in">로그인 필요</span></button>
      <div id="hdr-action"></div>
    </header>
    <main id="view"><div class="splash"><img src="./icons/icon-192.png" alt="" width="96" height="96"><p>하자싹</p></div></main>
    <nav class="tab-bar" aria-label="하단 메뉴">
      <a class="tab-item" data-tab="places" href="#/places"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>위치</a>
      <a class="tab-item" data-tab="list" href="#/list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 7h12M8 12h12M8 17h12"/><circle cx="4.5" cy="7" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="17" r="1.2" fill="currentColor" stroke="none"/></svg>하자</a>
      <a class="tab-item tab-new" data-tab="new" href="#/new"><span class="plus" aria-hidden="true">＋</span>기록</a>
      <a class="tab-item" data-tab="sets" href="#/sets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 5h12v14H6z"/><path d="M9 9h6M9 13h6"/></svg>목록</a>
      <a class="tab-item" data-tab="more" href="#/more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>더보기</a>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="busy" hidden><div class="busy-card"><div class="spinner"></div><div id="busy-text">처리 중…</div></div></div>
  <div id="print-root" aria-hidden="true"></div>
  <script src="./version.js"></script>
  <script src="./vendor/jszip/jszip.min.js"></script>
  <script type="module" src="./js/app.js"></script>

</html>
